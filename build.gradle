plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	accessWidenerPath = file("src/main/resources/roleplay-chat.accesswidener")

	splitEnvironmentSourceSets()

	mods {
		"roleplay-chat" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		gametest {
			inherit server
			name "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/junit.xml"
			runDir "build/gametest"
		}
		// Nom d'utilisateur fixe pour avoir un UUID constant entre les runs
		// UUID de DevPlayer : 74ffd488-66e1-390e-b3a4-68445a2d0ab8
		client {
			programArgs "--username", "DevPlayer"
		}

		clientGameTest {
			inherit client
			name "Client Game Test"
			vmArg "-Dfabric.client.gametest"
			vmArg "-Dfabric.client.gametest.testModResourcesPath=${project.file('src/client/resources').absolutePath}"
			// Requis pour les tests qui spawnen un joueur via EmbeddedChannel (ex: NameplateDisplayTest)
			vmArg "-Dfabric.client.gametest.disableNetworkSynchronizer"
			runDir "build/gametest"
		}
	}
}

test.dependsOn runGametest

// Crée eula.txt dans le runDir avant le lancement des client gametests,
// requis pour que TestDedicatedServerContext puisse démarrer un serveur dédié.
tasks.named("runClientGameTest").configure {
	doFirst {
		mkdir "build/gametest"
		file("build/gametest/eula.txt").text = "eula=true\n"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// GameTest dependencies (for Gradle's standard test task)
	testImplementation "com.mojang:minecraft:${project.minecraft_version}"
	testImplementation "net.fabricmc.fabric-api:fabric-gametest:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
